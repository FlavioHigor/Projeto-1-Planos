<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Contato</title>
</head>

<body>
  <header class="header">
    <div class="header__logo">MyServer</div>
    <nav class="header__nav">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="index.html">Planos</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>
  <section class="form_contato">
    <h2 class="font_title">Contato</h2>
    <form id="form-contact" action="#" onsubmit="return formAction(event)">
      <label>Nome</label>
      <input type="text" name="name" placeholder="Digite seu nome" autocomplete="off" />
      <label>Email</label>
      <input type="email" name="email" placeholder="Digite seu email" autocomplete="off" />
      <label>Mensagem</label>
      <textarea name="message" cols="30" rows="10" placeholder="Digite sua Mensagem"></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>
</body>

<script>
  const redirectToThanks = () => {
    window.location.href = "obrigado.html";
  };

  const formAction = async (event) => {
    event.preventDefault();
    var form = document.getElementById("form-contact");
    var formData = new FormData(form);
    var name = formData.get('name');
    var email = formData.get('email');
    var message = formData.get('message');

    await fetch("https://api.staticforms.xyz/submit", {
      method: "POST",
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        name: name,
        email: email,
        message: message,
        accessKey: "5e469ce5-f1bb-4ccb-baa6-9514d77e8222",
      }),
    })
      .then((response) => {
        redirectToThanks()
      });
  };
</script>

</html>
